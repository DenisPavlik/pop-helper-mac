            - generic [ref=e128]:
              - generic [ref=e129]: 1. Информация
              - generic [ref=e130]:
                - generic [ref=e131]: "Функционал программы:"
                - text: 1. Установка выбранных твиков (Некоторые твики можно настроить под себя);
                - text: 2. Установка русификатора для 3.9.5
                - text: 3. Автоматический бэкап сохранений игры;
                - text: 4. Автоматический бэкап изменяемых файлов игры при установке твиков.
                - text: 5. Починка сломанного сохранения с помощью последнего бэкапа;
                - text: 6. Проверка обновлений - программа уведомит вас, если вышла новая версия;
                - text: "7. Модификации:"
                - text: — Delzaros UI Pack
                - text: — Cursor Changer
                - text: — Economics of Pendor
                - text: — Другие женские лица
                - text: — Сжатые текстуры
                - text: — Music Pack
                - text: — Arena Overhaul Mod
                - text: — Polished Landscape
                - text: — Фикс коллизий
                - text: — Фикс "коров на воде"
                - text: — Old Qualis Gem
                - text: — No Dot Main Menu
                - text: "8. Шрифты:"
                - text: — Оригинал
                - text: — 1С
                - text: — Migel
                - text: — Русь 13
                - text: — Hammer
                - text: — Segoe Print
                - text: — WebeR
                - text: — ItalyA
                - text: — Medieval
                - text: — Theater
                - text: — Villa Avgustina
                - text: — Arial
                - text: — Calibri
                - text: 9. Собственный downloader (позволяет обновлять программу и скачивать модификации силами программы);
                - text: 10. Вкладка "Создание персонажа";
                - text: 11. Сбор логов. Если у вас произошла ошибка, вы можете воспользоваться системой сбора логов и связаться с нами для выяснения проблемы;
                - text: 12. Локальное сохранение конфигурации программы (PH_config.ini) - вы всегда можете восстановить настройки программы на любом компьютере, а также поделиться ими с кем-либо;
                - text: 13. Информационное онлайн-сообщение, которое появляется и обновляется при каждом запуске программы. В нём отражена информация по всем проблемам, если они будут обнаружены после публикации последней доступной версии.
                - text: 14. Настройка файла module.ini - позволяет настроить многие параметры модификации, которые не нашли свою реализацию в разделе "Твики".
                - text: 15. Вкладка "Редактирование файлов импорта/экспорта".
                - text: Твики со знаком звездочки (*) требуют начала новой игры для того, что бы они работали. Если их установить а потом деактивировать после последнего сейва - без них сейв не запустится.
                - generic [ref=e132]: "Известные проблемы:"
                - text: 1) Если загрузка модификаций/обновления производится за 1 секунду - включите альтернативные ссылки в настройках.
                - generic [ref=e133]: "Системные требования:"
                - text: "OS: Windows"
                - text: MS Visual C++ -
                - link "https://dl.repack.me/s/KEyzYbnKoiaGt23/download" [ref=e134] [cursor=pointer]:
                  - /url: https://steamcommunity.com/linkfilter/?u=https%3A%2F%2Fdl.repack.me%2Fs%2FKEyzYbnKoiaGt23%2Fdownload
                - text: У некоторых юзеров Win7 может появиться ошибка "Отсутствует api-ms-win-runtime-l1-1-0.dll".
                - text: "Подробное описание ошибки и методы её решения:"
                - link "https://vk" [ref=e135] [cursor=pointer]:
                  - /url: https://steamcommunity.com/linkfilter/?u=https%3A%2F%2Fvk
                - text: .cc/6lAmwr
                - text: Автор программы - не создатель этих твиков, и не создает их. Большая часть реализованных твиков и модификаций взята с форума rusmnb.ru
                - text: Если у вас возникает вопрос "Почему мой антивирус находит троян?"(или любую другую сигнатуру) - задайте его тем людям, которые называют свой софт антивирусами. Да и самого себя спросите - много ли Вы в этом понимаете. Программа не содержит вредоносного кода и не собирает какую-либо информацию, не относящуюся к самой программе или игре.
                - text: Как я могу это доказать? — Никак. Вам придется поверить мне на слово.
                - text: Вопросы "Почему не принимается стартовая информация; как принять; не нажимается кнопка принять" - будут игнорироваться! За любые оскорбления вы будете сидеть в чс(да, нам за это прилетают оскорбления). Там все написано на русском, читайте. Спасибо за понимание.
                - text: Программа полностью портативна и не нуждается в установке (исключение - не запускайте программу из архива).
            - generic [ref=e136]:
              - generic [ref=e137]: 2. Последнее обновление
              - generic [ref=e138]:
                - text: v. 3.9.1 (12.09.2020)
                - text: "- Исправлен некорректный бэкап модов, который приводил к крашам игры после их деактивации. Если у вас возникла подобная проблема, в служебных ключах введите \"/fix39\" - запустится процесс сброса конфликтных модов и исправление ошибки."
                - text: "- Исправлены стандартные значения для некоторых настроек (например для настройки автоматического обновления)."
                - text: "- Для стартовых сообщений при ошибке подключения к серверу изменён тип окна на \"информационный\", чтобы лишний раз не пугать \"ошибкой\"."
                - text: v. 3.9 (12.09.2020)
                - text: "ВНИМАНИЕ: Если по какой-либо причине в вашей папке с PoP 3.9.5 есть папки \"_backupHelper\" и \"_PoP Helper Cache\" (например, если вы обновили 3.9.5 в ту же папку, или играете через Steam) - удалите их перед первым использованием версии для 3.9.5. Либо в дополнительных функциях используйте функцию \"Служебные ключи\" и введите ключ \"/to39\"."
                - text: "- Твики адаптированы для PoP 3.9.5.1 (3.9.5 с хотфиксом). Некоторые твики могут содержать ошибки - нет возможности протестировать все возможности игры для всех твиков."
                - text: "- Новые твики:"
                - text: 1) [Честь] Отключить потерю чести при требовании дани с караванов.
                - text: 2) [Города/замки/деревни] Узнаём гарнизон через спутников.
                - text: 3) [Города/замки/деревни] Удалить "неэффективный сбор налогов".
                - text: 4) [Отряд] Добавление кнопки "Troop Tree" на экран отряда как в Viking Conquest.
                - text: 5) [Разное] Исправление зацикленных звуков таверны и арены.
                - text: 6) [Разное] Отключение функции "удача игрока".
                - text: 7) [Разное] Отказываемся от клятвы и оставляем владения.
                - text: "- Для твика \"Добавление предметов для СКО\" добавлена поисковая строка."
                - text: "- Айтем-лист для твика \"Добавление предметов для СКО\" адаптирован для версии 3.9.5."
                - text: "- Твик \"Улучшенная переклассификация войск в бою\" теперь является полноценной модификацией \"Динамическое переназначение дивизий и перевооружение\" (но всё ещё реализован в программе как твик). Ссылка:"
                - link "https://www.nexusmods.com/mbwarband/mods/6347" [ref=e139] [cursor=pointer]:
                  - /url: https://steamcommunity.com/linkfilter/?u=https%3A%2F%2Fwww.nexusmods.com%2Fmbwarband%2Fmods%2F6347
                - text: "- Убраны следующие твики:"
                - text: 1) Возможность управлять гарнизоном своих деревень
                - text: 2) Изменение времени улучшения всех вещей кузнецом из СКО
                - text: 3) Добавить автосохранение
                - text: "- Обновлён мод \"Сжатые текстуры\"."
                - text: "- Обновлён мод \"Polished Landscapes\"."
                - text: "- Обновлён мод \"Economics of Pendor\"."
                - text: "- Обновлён русификатор на самый актуальный на дату релиза."
                - text: "- Добавлен ключ \"+anyver\" который убирает проверку версии мода (позволяет использовать программу для любой указанной папки, на свой страх и риск)."
                - text: "- Добавлена опция \"Предложить функционал\" - открывает форму где вы можете высказать свою идею/предложение касательно контента и функционала программы."
                - text: "- Добавлена система актуализации кода твиков и модов при старте программы."
                - text: "- Добавлена функция \"Обновить пакет ресурсов\" (в \"Меню программы\"). Позволяет обновить все файлы-ресурсы программы, которые используются для установки модов и находятся в папке \"data\" программы."
                - text: "- Добавлен функционал обновления различных ссылок используемых в программе."
                - text: "- Добавлена возможность поддержать разработчиков через Qiwi (в разделе \"О программе\")."
                - text: "- Добавлен таймер подключения к фтп-серверу, теперь программа не зависает при запуске в случае временной недоступности сервера."
                - text: "- Исправлено создание мусорной папки при первом запуске программы."
                - text: "- Исправлено отсутствие обновления основных путей программы при измененни рабочей папки."
                - text: "- Полностью переписана система установки твиков. Теперь исправление кода твиков (и модов) не требуют новой версии программы. Новые твики - только с новыми версиями."
                - text: "- Полностью переписана система сканирования твиков."
                - text: "- Загружаемые настройки теперь сохраняются на случай отсутствия возможности загрузить их при следующем запуске программы."
                - text: "- Возвращена функция \"Не делать сброс файлов мода перед установкой твиков и модификаций\"."
                - text: "- Теперь программа не разделяется на x32/x64 бит. Эта и все последующие версии - x32."
                - text: "- Downloader интегрирован в сам PoP Helper."
                - text: "- Удален функционал бета-версий."
                - text: "- Удалена вариативность в установке русификатора."
                - text: "- Удалено старое стартовое предупредение о запуске программы и игры одновременно."
                - text: "- Удалено стартовое сообщение от разработчиков."
                - text: "- Удален ключ для отключения автоматической установки русификатора, теперь это настройка в окне \"Настройки\"."
                - text: "- Удалена ссылка \"[Dropbox] Скачать полную версию\"."
                - text: "- Оптимизация кода."
                - text: Полный список изменений за все время существования программы можно посмотреть в самой программе.
