          - list [ref=e227]:
            - listitem [ref=e228]:
              - generic [ref=e229]: All of the following tweaks were made for or updated to v3.9.5.1 (same version as the v3.9.5.6.zip downloaded from ModDB). Some might be compatible with previous versions too, but the majority are not, so proceed with caution! Those that work with other mods as is, or can be adjusted so relatively easily will be marked with green and blue respectively
            - listitem [ref=e230]: It is mandatory to use Notepad++ for editing .txt and .csv files, as some tweaks will not apply properly with regular Notepad or MS Office and such! Also, Notepad++ has many QoL features that make it much easier to apply tweaks, such as the number of the line being displayed on the left for instance.
            - listitem [ref=e231]: Make sure that you create regular backups of your tweaked files in case you screw something up, so that you won't have to revert all of your tweaks by copying back the original files. Furthermore, it may be possible that your tweaked savegame file won't be compatible with the original version of the mod anymore, which is another good reason for creating regular backups.
            - listitem [ref=e232]: Beware that in case of certain tweaks, the piece of code to be searched for (to replace, delete, etc.) might be too long to fit into the search bar, resulting in the remaining part getting cut out. So proceed with caution and always make sure that everything is selected that needs to be!
            - listitem [ref=e233]: The parts copy-pasted from this page might add an unwanted new line ('enter') if you have the extra gap/space selected in the end, splitting the given game code in two upon insertion. This creates unfunctional tweaks and severe bugs. To avoid this, when you select the whole piece to be copied, make sure you do so by having the highlight stop at the last number. Or, remove the extra 'enter' character after the insertion.
