            - heading "Introduction" [level=2] [ref=e230]
            - paragraph [ref=e231]: I won’t be teaching you the scripting language of Warband here, this is a guide to help with your understanding of compiled module because unfortunately, Pendor devs won’t provide us with source files of module system and known decompilers don’t decompile the module into compilable form so we have to make do with .txt files. You can still use decompiled pendor files for reference though.
            - paragraph [ref=e232]: The tweaking is done through editing .txt files that are located at …/MountBlade Warband/Modules/*ModName*. Obviously you need a txt files editor, Notepad++ is really great and recommended.
            - paragraph [ref=e233]:
              - text: "If you need help understanding the module system, try here:"
              - link "https://forums.taleworlds.com/index.php/board,171.0.html" [ref=e234] [cursor=pointer]:
                - /url: //forums.taleworlds.com/index.php/board,171.0.html
            - heading "Module System and .txt files" [level=2] [ref=e235]
            - paragraph [ref=e236]: "All .txt files you see in the main folder (module) of mods are compiled from the Module System's .py files, which contain the source code. The majority of .py files share the same name with that of .txt files, extended with a \"module_\" prefix. Except for these 4:"
            - list [ref=e237]:
              - listitem [ref=e238]: item_kinds1.txt is compiled from module_items.py
              - listitem [ref=e239]: menus.txt is compiled from module_game_menus
              - listitem [ref=e240]: conversation.txt is compiled from module_dialogs
              - listitem [ref=e241]: dialog_states.txt is compiled from module_dialogs
            - paragraph [ref=e242]:
              - text: "You can download all Module System (MS) header files from here (courtesy of Dalion):"
              - link "https://www.dropbox.com/s/v99swtb1s0ld70u/MS%20header%20files.rar?dl=0" [ref=e243] [cursor=pointer]:
                - /url: https://www.dropbox.com/s/v99swtb1s0ld70u/MS%20header%20files.rar?dl=0
              - text: These are not to be confused with the module files, as they do not contain any source code. But they enlist all the possible compiled codes you can see in the respective .txt files (in decimal format), with explanations on what they do and how to use them. As such, they all have a "header_" prefix.
            - heading "General numbers" [level=2] [ref=e245]
            - paragraph [ref=e246]: "Once you open some .txt files, you will mostly see numbers inside. Every number has its meaning and here I will describe the types of numbers that are applicable to every .txt file that we will be working with. They are:"
            - list [ref=e247]:
              - listitem [ref=e248]: Counters
              - listitem [ref=e249]:
                - text: "Operation codes - they are given constants, and each of these numbers mean a certain operation. You can look them up in header_operations.py:"
                - link "https://www.dropbox.com/s/hegpny2ek8eieog/header_operations.py?dl=0" [ref=e250] [cursor=pointer]:
                  - /url: https://www.dropbox.com/s/hegpny2ek8eieog/header_operations.py?dl=0
                - text: ". The most important ones are:"
                - list [ref=e251]:
                  - listitem [ref=e252]: neg (negate) - 2147483648
                  - listitem [ref=e253]: this_or_next - 1073741824
                  - listitem [ref=e254]: le (less than or equal to) - 2147483680 (neg + gt = 2147483648 + 32)
                  - listitem [ref=e255]: lt (less than) - 2147483678 (neg + ge = 2147483648 + 30)
                  - listitem [ref=e256]: neq (not equal) - 2147483679 (neg + eq = 2147483648 + 31)
              - listitem [ref=e257]:
                - text: "Operands - there are many types of them:"
                - list [ref=e258]:
                  - listitem [ref=e259]: Global Variables – 144115188075855871 + № of variable from variables.txt (line number in Notepad++)
                  - listitem [ref=e260]: Local Variables – 1224979098644774912, 1224979098644774913, etc, etc.
                  - listitem [ref=e261]: Registers – 72057594037927936 (reg0), 72057594037927937 (reg1), etc, etc.
                  - listitem [ref=e262]: Scripts – 936748722493063168 + № of a script from scripts.txt (script number = (line-3)/2 in Notepad++)
                  - listitem [ref=e263]: Menus - 864691128455135232 + № of a menu from menus.txt (menu number = (line-3)/2 in Notepad++)
                  - listitem [ref=e264]:
                    - link "Skills" [ref=e265] [cursor=pointer]:
                      - /url: /wiki/Skills
                    - text: "- 1369094286720630784 + № of a skill from skills.txt (line-2 in Notepad++)"
                  - listitem [ref=e266]: Items - 288230376151711744 + № of an item from item_kinds1.txt (entry number in Morgh's Editor)
                  - listitem [ref=e267]:
                    - link "Troops" [ref=e268] [cursor=pointer]:
                      - /url: /wiki/Troops
                    - text: – 360287970189639680 + № of a troop from troops.txt (entry number in Morgh's Editor)
                  - listitem [ref=e269]: Factions – 432345564227567616 + № of a faction from factions.txt (entry number in Morgh's Editor)
                  - listitem [ref=e270]: Parties – 648518346341351424 + № of a party from parties.txt (entry number in Morgh's Editor)
                  - listitem [ref=e271]: Party templates - 576460752303423488 + № of a template from party_templates.txt (entry number in Morgh's Editor)
                  - listitem [ref=e272]: Strings - 216172782113783808 + № of a string from strings.txt (line-3 in Notepad++)
                  - listitem [ref=e273]: Quick strings - 1585267068834414592 + № of a string from quick_strings.txt (line-2 in Notepad++)
                  - listitem [ref=e274]: Quests - 504403158265495552 + № of a quest from quests.txt (line-3 in Notepad++)
                  - listitem [ref=e275]: Dialogue state ID numbers - № of a dialogue ID from dialog_states.txt (line-1 in Notepad++), used in conversation.txt (the numbers before 2 space characters)
                  - listitem [ref=e276]: Conversation operands - № of an operand from conversation.txt (the first number after "dlga_..." strings). They either represent troops (mostly NPCs until ~1200) or actual conversation operands like 4095 (anyone else) and 69631 (the player), deciding which side is currently speaking. When updating a conversation tweak to a newer mod version, the offset of the last troop in troops.txt has to be applied to these operands as well, except for 4095 and 69631 (as those are static).
                  - listitem [ref=e277]: Sounds - 1152921504606846976 + № of a sound from sounds.txt (line - counter_in_2nd_line_of_the_file - 4 in Notepad++)
                  - listitem [ref=e278]: Scene props - 1080863910568919040 (cannot be specified with one formula!)
                  - listitem [ref=e279]: Particles - 1008806316530991104 + № of a particle from particle_systems.txt (particle number = (line-3)/8 in Notepad++)
                  - listitem [ref=e280]: "Presentations - 1513209474796486655 + sequence № of given prsnt_... in presentations.txt, counting the 1st \"prsnt_\" as #1"
                  - listitem [ref=e281]: Music - 1657324662872342528 + № of a music from music.txt (line-2 in Notepad++)
                  - listitem [ref=e282]: Animations (actions.txt) - 1801439850948198400 (cannot be specified with one formula!)
                  - listitem [ref=e283]: "Mission templates - 792633534417207295 + sequence № of given mst_... in mission_templates.txt, counting the 1st \"mst_\" as #1"
                  - listitem [ref=e284]: Scenes - 720575940379279360 + № of a scene from scenes.txt (scene number = (line-3)/4 in Notepad++)
                  - listitem [ref=e285]: Meshes - 1441151880758558720 + № of a mesh from meshes.txt (line-2 in Notepad++)
                  - listitem [ref=e286]: Tableau materials - 1729382256910270467 + № of a tableau material from tableau_materials.txt (line-2 in Notepad++)
            - heading "General structure of codes in .txt files" [level=2] [ref=e288]
            - paragraph [ref=e289]: "The first number is always a counter for the amount of operations done inside a script, after it the operations themselves begin, which repeatedly consist of:"
            - list [ref=e290]:
              - listitem [ref=e291]: An operation code
              - listitem [ref=e292]: A number that describes the amount of operands in that specific operation. Can be 0 as well, which means that no operands will follow and the next number will be an operation code again
              - listitem [ref=e293]: Operands
            - paragraph [ref=e294]: Single whitespace characters are used to separate each number, and double whitespace characters are used to separate two different code blocks.
            - heading "Simple_triggers tweaks" [level=2] [ref=e295]
            - paragraph [ref=e296]: At the very top of simple_triggers file is a number that describes an amount of simple triggers in it. They consist of a period in hours which describes how often they are triggered. After it begins a script.
            - heading "Dialogue tweaks" [level=2] [ref=e297]
            - paragraph [ref=e298]: "In dialog_states.txt listed all states of dialogs. To add a new one you need to do it at the bottom of it. In conversations.txt the lines consist of:"
            - list [ref=e299]:
              - listitem [ref=e300]: Current dialogue state
              - listitem [ref=e301]: Next dialogue state
              - listitem [ref=e302]: Number that describes who is talking, most common ones are 69631 for MC and 4095 for anyone else.
              - listitem [ref=e303]: № of current dialogue from dialog_states.txt
              - listitem [ref=e304]: Script that acts as availability check for dialogue option. 0 if it’s always available.
              - listitem [ref=e305]: Dialogue text
              - listitem [ref=e306]: № of next dialogue from dialog_states.txt
              - listitem [ref=e307]: Script for consequences of choosing this option
              - listitem [ref=e308]: String that describes sound file playing during conversation, NO_VOICEOVER for nothing.
